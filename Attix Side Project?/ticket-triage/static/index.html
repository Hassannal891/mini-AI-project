<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support Ticket Triage</title>
<style>body{font:18px system-ui;max-width:740px;margin:70px auto;padding:24px;background:#f4f6fa;color:#172238}textarea{box-sizing:border-box;width:100%;padding:16px;font:inherit;border:1px solid #aab7ca;border-radius:10px}button{padding:13px 24px;background:#214cd5;color:white;border:0;border-radius:8px;font:inherit;margin:16px 0;cursor:pointer}pre{white-space:pre-wrap;background:white;padding:24px;border-radius:12px}small{color:#526079}</style>
<h1>Support Ticket Triage</h1><p>Turn a customer message into a suggested support queue.</p>
<form id="form"><label for="text">Customer message</label><textarea id="text" rows="5" minlength="3" maxlength="5000" required>I was charged twice for my subscription this month.</textarea><button id="button">Classify ticket</button></form>
<pre id="result" aria-live="polite">Ready when you are.</pre><small>Demo model trained on synthetic English tickets. Scores are not calibrated certainty. Review ambiguous or unfamiliar requests. No ticket text is stored by this application.</small>
<script>const form=document.querySelector('#form'),result=document.querySelector('#result'),button=document.querySelector('#button');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;result.textContent='Classifying…';try{const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.querySelector('#text').value})});const d=await r.json();if(!r.ok)throw Error('Please enter a valid message (3–5,000 characters).');result.textContent=`Suggested queue: ${d.category}\nModel score: ${d.score}\nHuman review: ${d.needs_review?'Yes':'Not requested by policy'}\nReason: ${d.reason}\nModel: ${d.model_version}`;}catch(e){result.textContent=e.message;}finally{button.disabled=false;}});</script></html>
